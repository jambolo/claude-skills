[package]
name = "@PROJECT_NAME@"
version = "0.1.0"
edition = "2024"
description = "Tauri shell: owns the window and exposes the compute core to the web UI."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
@PROJECT_NAME@-core = { path = "../src-core" }
