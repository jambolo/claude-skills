name: CI

on:
  push:
    branches:
      - master
      - develop
      - 'release/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: ''

jobs:
  build-and-test:
    name: Build & Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Configure, build, verify headers, test
        run: cmake --workflow --preset ci

  lint-and-format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Format check
        run: git ls-files '*.cpp' '*.h' | xargs -r clang-format --dry-run --Werror
      - name: Configure (compile database, tests included)
        run: cmake --preset ci
      - name: Lint
        run: git ls-files '*.cpp' | xargs -r clang-tidy -p build/ci

  docs:
    name: Build and deploy docs
    if: github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build documentation
        run: cmake --workflow --preset docs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  coverage:
    name: Coverage
    if: github.ref == 'refs/heads/develop'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gcovr
        run: pipx install gcovr
      - name: Build and test with coverage
        run: cmake --workflow --preset coverage
      - name: Generate coverage report
        run: gcovr -r . --xml -o coverage.xml --exclude 'build/' --exclude 'test/'
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
